[project]
name = "mercado-sabanero"
version = "1.0.0"
description = "Módulo de liquidación de compras - Mercado Sabanero"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/mercado_sabanero"]

[tool.coverage.report]
show_missing = true
